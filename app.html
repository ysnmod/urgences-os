const CCMUSteps = ({ score = 1 }) => {
    const s = Math.max(1, Math.min(5, Number(score) || 1));

        { label: '1', tone: 'bg-emerald-500' },
        { label: '2', tone: 'bg-lime-500' },
        { label: '3', tone: 'bg-amber-500' },
        { label: '4', tone: 'bg-orange-500' },
        { label: '5', tone: 'bg-red-600' },

                <div>

                <div className="text-lg font-black text-slate-800">C{s}</div>

            <div className="grid grid-cols-5 gap-2">
                {steps.map((step, index) => {
                    const active = index + 1 <= s;

            </div>
            <div className="mt-3 text-[10px] font-bold uppercase tracking-wide text-slate-400 flex justify-between">
                <span>Stable</span><span>Urgent</span><span>Critique</span>
            </div>
        </div>
    );
};

const Acceuil = ({ patients, fetchPatients }) => {

        const qStr = (overrideQuery !== undefined ? overrideQuery : searchQuery).trim();
        if (qStr.length < 2) {
            setSearchResults([]);
            return;
        }
        try {
            const res = await apiFetch(`/patients/search?q=${encodeURIComponent(qStr)}`);
            if (res.ok) setSearchResults(await res.json());
        } catch {}
    };

        try {
            const res = await apiFetch(`/sejours/historique`);
            if (res.ok) setHistorique(await res.json());
        } catch {}
    };
    useEffect(() => { fetchHistorique(); }, [patients]);

        e.preventDefault();
        const body = selectedExisting
            ? { mode_arrivee: formData.mode_arrivee, motif_visite: formData.motif_visite, patient_id: selectedExisting.patient_id }
            : { mode_arrivee: formData.mode_arrivee, motif_visite: formData.motif_visite, patient_data: { nom: formData.nom.toUpperCase(), prenom: formData.prenom, date_naissance: formData.date_naissance || null, sexe: formData.sexe || null, telephone: formData.telephone || null, numero_secu: formData.numero_secu || null } };

            const res = await apiFetch(`/admissions/`, { method: 'POST', body: JSON.stringify(body) });
            if (res.ok) {
                const admissionResult = await res.json();
                const sejourId = admissionResult.sejour_id;
                
                // If SMUR data provided, create dossier préhospitalier
                if ((formData.mode_arrivee === 'SMUR' || formData.mode_arrivee === 'pompiers') &&

                            numero_samu: formData.numero_samu || `SMUR-${Date.now()}`,
                            heure_appel_samu: formData.heure_appel_samu || new Date().toISOString().slice(0, 19).replace('T', ' '),
                            motif_appel: formData.motif_visite,
                            priorite_samu: 'URGENCE_VITALE',

const getGcsBadgeColor = (score) => {
    if (score >= 15) return 'bg-green-600 text-white';
    if (score >= 13) return 'bg-lime-500 text-white';
    if (score >= 10) return 'bg-yellow-500 text-white';
    if (score >= 7) return 'bg-orange-500 text-white';
    return 'bg-red-600 text-white';
};
const getGcsCardStyle = (score) => {
    if (score >= 15) return { c: 'text-green-600', bg: 'bg-green-50', b: 'border-green-100' };
    if (score >= 13) return { c: 'text-lime-600', bg: 'bg-lime-50', b: 'border-lime-100' };
    if (score >= 10) return { c: 'text-yellow-600', bg: 'bg-yellow-50', b: 'border-yellow-100' };
    if (score >= 7) return { c: 'text-orange-600', bg: 'bg-orange-50', b: 'border-orange-100' };
    return { c: 'text-red-600', bg: 'bg-red-50', b: 'border-red-100' };
};
const TriageModule = ({ patients, currentUser, fetchPatients }) => {
    const [selectedPatient, setSelectedPatient] = useState(null);
    const [triageData, setTriageData] = useState({ temperature: 37.0, fc: 80, ta_systolique: 120, ta_diastolique: 80, spo2: 98, douleur: 0, zone: 'Attente', notes: '', score_ccmu: 1 });
    const [gcs, setGcs] = useState({ e: 4, v: 5, m: 6 });
    const [msg, setMsg] = useState(null);
    const [aiSuggestion, setAiSuggestion] = useState(null);
    const [deteriorationRisk, setDeteriorationRisk] = useState(null);
    const prevVitalsRef = useRef(null);
    const isUrgenceVitale = !!selectedPatient && selectedPatient.priorite_initiale === 'URGENCE_VITALE';
    const patientLit = selectedPatient?.lit;
    useEffect(() => {
        if (!selectedPatient) return;
        const t = selectedPatient.triage;
        if (t) {
            const zone = patientLit ? patientLit.salle : (selectedPatient.priorite_initiale === 'URGENCE_VITALE' ? 'Dechocage' : (t.zone || 'Attente'));
            setTriageData({
                temperature: t.temperature ?? 37.0, fc: t.fc ?? 80,
                ta_systolique: t.ta_systolique ?? 120, ta_diastolique: t.ta_diastolique ?? 80,
                douleur: t.douleur ?? 0, spo2: t.spo2 ?? 98,
                zone, notes: t.notes || '', score_ccmu: t.score_ccmu || 1,
            });
            const total = t.glasgow || 15;
            setGcs({ e: Math.min(4,Math.max(1,Math.ceil(total/3.75))), v: Math.min(5,Math.max(1,Math.ceil(total/3))), m: Math.max(1,total-Math.ceil(total/3.75)-Math.ceil(total/3)) });
        } else {
            setTriageData({ temperature: 37.0, fc: 80, ta_systolique: 120, ta_diastolique: 80, spo2: 98, douleur: 0, zone: patientLit ? patientLit.salle : (selectedPatient.priorite_initiale === 'URGENCE_VITALE' ? 'Dechocage' : 'Attente'), notes: '', score_ccmu: 1 });
            setGcs({ e: 4, v: 5, m: 6 });
        }
        setAiSuggestion(null);
        setDeteriorationRisk(null);
    }, [selectedPatient]);
    useEffect(() => {
        if (!selectedPatient) return;
        const timer = setTimeout(async () => {
            const gtotal = parseInt(gcs.e) + parseInt(gcs.v) + parseInt(gcs.m);
            const safeSpo2 = Math.min(100, Math.max(50, parseInt(triageData.spo2 || 98)));
            const safeTemp = Math.min(42, Math.max(34, parseFloat(triageData.temperature || 37)));
            const safeFc = Math.min(250, Math.max(30, parseInt(triageData.fc || 80)));
            const safeTas = Math.min(280, Math.max(50, parseInt(triageData.ta_systolique || 120)));
            const safeTad = Math.min(180, Math.max(20, parseInt(triageData.ta_diastolique || 80)));
            const safeEva = Math.min(10, Math.max(0, parseInt(triageData.douleur || 0)));
            try {
                const res = await apiFetch('/ml/suggest-priority', {
                    method: 'POST',
                    body: JSON.stringify({
                        age: selectedPatient.age || 40, sexe: selectedPatient.sexe || 'M',
                        mode_arrivee: selectedPatient.mode_arrivee || 'autonome',
                        poids: 70,
                        temperature: safeTemp, fc: safeFc,
                        ta_systolique: safeTas, ta_diastolique: safeTad,
                        spo2: safeSpo2, glasgow_total: gtotal,
                        douleur_eva: safeEva, tranche_horaire: 'Matin',
                        jour_semaine: new Date().getDay(), weekend: [0,6].includes(new Date().getDay()) ? 1 : 0,
                    })
                });
                if (res.ok) setAiSuggestion(await res.json());
            } catch {}
            try {
                const prevV = prevVitalsRef.current;
                const res2 = await apiFetch('/ml/deterioration-risk', {
                    method: 'POST',
                    body: JSON.stringify({
                        fc: safeFc, spo2: safeSpo2,
                        ta_systolique: safeTas, ta_diastolique: safeTad,
                        temperature: safeTemp, glasgow_total: gtotal,
                        douleur_eva: safeEva, rythme: 'sinusal',
                        prev_fc: prevV?.fc ?? null,
                        prev_spo2: prevV?.spo2 ?? null,
                        prev_ta_systolique: prevV?.ta_systolique ?? null,
                        prev_glasgow_total: prevV?.glasgow_total ?? null,
                    })
                });
                if (res2.ok) setDeteriorationRisk(await res2.json());
                prevVitalsRef.current = {
                    fc: safeFc, spo2: safeSpo2,
                    ta_systolique: safeTas, glasgow_total: gtotal,
                };
            } catch {}
        }, 500);
        return () => clearTimeout(timer);
    }, [triageData.fc, triageData.ta_systolique, triageData.ta_diastolique, triageData.temperature, triageData.spo2, triageData.douleur, gcs, selectedPatient?.sejour_id]);
    const handleSubmit = async () => {
        if (!triageData.score_ccmu) { setMsg({ type: 'error', text: 'Score CCMU requis.' }); return; }
        try {
            const endpoint = selectedPatient.score_ccmu ? '/retriage/' : '/triage/';
            const res = await apiFetch(endpoint, {
                method: 'POST',
                body: JSON.stringify({
                    sejour_id: selectedPatient.sejour_id, soignant_id: currentUser.personnel_id,
                    score_ccmu: parseInt(triageData.score_ccmu),
                    temperature: parseFloat(triageData.temperature), fc: parseInt(triageData.fc),
                    ta_systolique: parseInt(triageData.ta_systolique), ta_diastolique: parseInt(triageData.ta_diastolique),
                    spo2: parseInt(triageData.spo2 || 98),
                    glasgow: parseInt(gcs.e) + parseInt(gcs.v) + parseInt(gcs.m),
                    douleur: parseInt(triageData.douleur), notes: triageData.notes, zone: triageData.zone,
                })
            });
            if (res.ok) {
                setMsg({ type: 'success', text: `Triage validé.` });
                setSelectedPatient(null);
                setTriageData({ temperature: 37.0, fc: 80, ta_systolique: 120, ta_diastolique: 80, spo2: 98, douleur: 0, zone: 'Attente', notes: '', score_ccmu: 1 });
                setGcs({ e: 4, v: 5, m: 6 });
                fetchPatients(); setTimeout(() => setMsg(null), 3000);
            } else setMsg({ type: 'error', text: "Erreur sauvegarde." });
        } catch { setMsg({ type: 'error', text: 'Réseau injoignable.' }); }
    };
    const patientsATriger = patients.filter(p => p.statut !== 'Sorti' && !p.score_ccmu);
    const patientsDejaTries = patients.filter(p => p.statut !== 'Sorti' && !!p.score_ccmu);
    const fields = [
        { label: 'Temp. (°C)', key: 'temperature', step: '0.1', icon: 'fa-temperature-half' },
        { label: 'FC (bpm)', key: 'fc', icon: 'fa-heart-pulse' },

        { label: 'TAD (mmHg)', key: 'ta_diastolique', icon: 'fa-arrow-down' },
        { label: 'SpO2 (%)', key: 'spo2', icon: 'fa-lungs' },
        { label: 'EVA (0-10)', key: 'douleur', min: '0', max: '10', icon: 'fa-face-frown' },
    ];
    return (
        <div className="grid grid-cols-1 xl:grid-cols-4 gap-6 h-full overflow-y-auto pb-20 animate-fade-in">
            <div className="xl:col-span-1 glass-card rounded-2xl border border-slate-100 p-5 flex flex-col h-full hover-lift">

                ) : (

};
const DossierModal = ({ sejourId, currentUser, onClose, onUpdate }) => {
    const [dossier, setDossier] = useState(null);
    const [loading, setLoading] = useState(true);
    const [activeTab, setActiveTab] = useState('constantes');
    const [newExamen, setNewExamen] = useState('');
    const [examenStatut, setExamenStatut] = useState('réalisé');  // par défaut
    
    const fetchDossier = async () => {
        try {
            setLoading(true);
            const res = await apiFetch(`/sejours/${sejourId}`);
            if (res.ok) {
                const data = await res.json();
                setDossier(data);
                
                // Chercher un dossier préhospitalier lié à ce séjour
                try {
                    const samuRes = await apiFetch(`/samu/by-sejour/${sejourId}`);
                    if (samuRes.ok) {
                        const dossierForSejour = await samuRes.json();
                        if (dossierForSejour) {
                            setDossierPrehospitalier(dossierForSejour);
                        } else {
                            setDossierPrehospitalier(null);
                        }
                    }
                } catch (samuErr) {
                    // Pas de dossier préhospitalier, c'est normal
                    setDossierPrehospitalier(null);
                }
            }
        } catch (e) {
            console.error('Erreur fetchDossier:', e);
        } finally {
            setLoading(false);
        }
    };
    
    useEffect(() => { fetchDossier(); }, [sejourId]);

    // Missing state declarations
    const [newObs, setNewObs] = useState('');
    const [newMeds, setNewMeds] = useState({ nom: '', dose: '' });
    const [exMsg, setExMsg] = useState(null);
    const [courrier, setCourrier] = useState('');
    const [sortieData, setSortieData] = useState({ diagnostic: '', mode_sortie: 'retour_domicile' });
    const [isSortieAdmin, setIsSortieAdmin] = useState(false);
    const [selectedLitId, setSelectedLitId] = useState('');
    const [litsDispos, setLitsDispos] = useState([]);
    const [courrierMeta, setCourrierMeta] = useState(null);
    const [dossierPrehospitalier, setDossierPrehospitalier] = useState(null);
    // Autocomplete states
    const [medQuery, setMedQuery] = useState('');
    const [medResults, setMedResults] = useState([]);
    const [medTotal, setMedTotal] = useState(0);
    const [showMedDropdown, setShowMedDropdown] = useState(false);
    const [exQuery, setExQuery] = useState('');
    const [exResults, setExResults] = useState([]);
    const [exTotal, setExTotal] = useState(0);
    const [showExDropdown, setShowExDropdown] = useState(false);
    const [interactions, setInteractions] = useState([]);
    const [showInteractions, setShowInteractions] = useState(false);
    const medDebounce = useRef(null);
    const exDebounce = useRef(null);

    const prescrireExamen = async () => { 
        if(!newExamen) return; 
        await apiFetch(`/examens/`,{
            method:'POST',
            body:JSON.stringify({
                sejour_id:sejourId,
                prescripteur_id:currentUser.personnel_id,
                type_examen:newExamen,
                statut:examenStatut
            })
        }); 
        setExMsg('Examen enregistré.'); 
        setNewExamen(''); 
        setExamenStatut('réalisé');
        fetchDossier(); 
        setTimeout(()=>setExMsg(null),2000); 
    };
    const ajouterObs = async () => { if(!newObs.trim())return; await apiFetch(`/observations/`,{method:'POST',body:JSON.stringify({sejour_id:sejourId,auteur_id:currentUser.personnel_id,texte:newObs})}); setNewObs(''); fetchDossier(); };
    // Medicament autocomplete search
    const searchMedicaments = (q) => {
        setMedQuery(q);
        if (medDebounce.current) clearTimeout(medDebounce.current);
        medDebounce.current = setTimeout(async () => {
            const url = q && q.length > 0 ? '/medicaments/search?q=' + encodeURIComponent(q) + '&limit=50' : '/medicaments/search?limit=50';
            const res = await apiFetch(url);
            if (res.ok) { const d = await res.json(); setMedResults(d.results || []); setMedTotal(d.total || 0); }
        }, q ? 250 : 0);
    };
    // Examen autocomplete search
    const searchExamens = (q) => {
        setExQuery(q);
        if (exDebounce.current) clearTimeout(exDebounce.current);
        exDebounce.current = setTimeout(async () => {
            const url = q && q.length > 0 ? '/examens-types/search?q=' + encodeURIComponent(q) + '&limit=100' : '/examens-types/search?limit=100';
            const res = await apiFetch(url);
            if (res.ok) { const d = await res.json(); setExResults(d.results || []); setExTotal(d.total || 0); }
        }, q ? 250 : 0);
    };
    const extractDose = (name) => { const m = name.match(/(\d+(?:[.,]\s*)?\d*\s*(?:mg|g|µg|ml|UI|%))/i); return m ? m[1].trim() : ''; };
    const checkInteractions = async (drugName) => {
        if (!sejourId || !drugName) return;
        const res = await apiFetch('/interactions/check-by-sejour?sejour_id=' + sejourId + '&new_drug=' + encodeURIComponent(drugName));
        if (res.ok) { const d = await res.json(); setInteractions(d.interactions || []); setShowInteractions(d.interactions && d.interactions.length > 0); }
    };
    const ajouterPresc = async () => {
        if(!newMeds.nom.trim())return;
        await checkInteractions(newMeds.nom);
        const res = await apiFetch(`/prescriptions/`,{method:'POST',body:JSON.stringify({sejour_id:sejourId,prescripteur_id:currentUser.personnel_id,medicament:newMeds.nom,dose:newMeds.dose})});
        if(res.ok){ setNewMeds({nom:'',dose:''}); setShowInteractions(false); setShowMedDropdown(false); setMedQuery(''); setMedResults([]); fetchDossier(); }else alert('Erreur');
    };
    const supprimerPrescription = async (pid) => { await apiFetch(`/prescriptions/${pid}`, {method:'DELETE'}); fetchDossier(); };
    const genererCourrier = async () => { const res = await apiFetch(`/sejours/${sejourId}/courrier`); if(res.ok){ const data = await res.json(); setCourrier(data.courrier); setCourrierMeta(data); } };
    const enregistrerSortie = async () => { if(!courrier)return alert("Générez le courrier."); if(!sortieData.diagnostic.trim())return alert("Diagnostic requis."); const res = await apiFetch(`/sejours/${sejourId}/sortie`,{method:'PUT',body:JSON.stringify({diagnostic_sortie:sortieData.diagnostic,mode_sortie:sortieData.mode_sortie,courrier_sortie:courrier,sortie_administrative:isSortieAdmin})}); if(res.ok){onUpdate();onClose();} };

                    sejour_id: sejourId,
                    lit_id: parseInt(selectedLitId)
                })
            });
            if (res.ok) {
                fetchDossier();
                setSelectedLitId('');
            }
        } catch (error) {
            console.error('Erreur assignation lit:', error);
        }
    };
    
    const fetchLitsDispos = async () => {
        try {
            const res = await apiFetch(`/lits/`);
            if (res.ok) {
                const lits = await res.json();
                const dispos = lits.filter(l => l.statut === 'libre');
                setLitsDispos(dispos);
            }
        } catch (error) {
            console.error('Erreur fetch lits:', error);
        }

    useEffect(() => {
        if (dossier && !dossier.lit && dossier.statut !== 'Sorti') {
            fetchLitsDispos();
        }

    if (loading) return <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50"><i className="fa-solid fa-circle-notch fa-spin text-white text-5xl"></i></div>;
    if (!dossier) return null;
    const t = dossier.triage;
    const tabs = [
        ['constantes','Constantes','fa-heart-pulse'],

const GestionLits = () => {

    const [adminMode, setAdminMode] = useState(false);

            if (resLits.ok) setLits(await resLits.json());

                            <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wide block mb-1">Freq. Respiratoire</label><input type="number" className="w-full p-3 modern-input rounded-xl text-sm" value={vitalsForm.fr} onChange={e=>setVitalsForm({...vitalsForm,fr:e.target.value})} /></div>
                            <div><label className="text-xs font-bold text-slate-500 uppercase tracking-wide block mb-1">Glasgow Total</label><input type="number" className="w-full p-3 modern-input rounded-xl text-sm" min="3" max="15" value={vitalsForm.glasgow_total} onChange={e=>setVitalsForm({...vitalsForm,glasgow_total:e.target.value})} /></div>
                        </div>
                        <div className="mb-6"><label className="text-xs font-bold text-slate-500 uppercase tracking-wide block mb-2">EVA Douleur (0-10)</label><input type="range" min="0" max="10" className="w-full" value={vitalsForm.douleur} onChange={e=>setVitalsForm({...vitalsForm,douleur:parseInt(e.target.value)})} /><div className="text-center font-black text-lg text-slate-800">{vitalsForm.douleur}/10</div></div>
                        <button onClick={saveVitals} className="w-full bg-slate-800 text-white py-3.5 rounded-xl font-bold hover:bg-slate-900 transition shadow-lg flex items-center justify-center"><i className="fa-solid fa-save mr-2"></i>Enregistrer les constantes</button>
                    </div>
                </div>
            )}
            {showHistoryModal && selectedPatient && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-start justify-center z-50 pt-24 pb-8 px-4 animate-fade-in">
                    <div className="modal-frosted rounded-3xl w-full max-w-4xl animate-slide-up flex flex-col max-h-[calc(100vh-8rem)]">
                        <div className="flex justify-between items-center px-6 pt-6 pb-3"><h3 className="font-black text-slate-800 dark:text-slate-200 text-lg">Historique des constantes</h3><button onClick={()=>setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 flex-shrink-0"><i className="fa-solid fa-xmark text-xl"></i></button></div>
                        <div className="overflow-y-auto flex-1 min-h-0 px-6 pb-6 scrollbar-teal">
                            {vitalsHistory.length === 0 ? (
                                <div className="text-center py-12 text-slate-400"><i className="fa-solid fa-clock-rotate-left text-4xl mb-4"></i><p>Aucun historique disponible</p></div>
                            ) : (
                                <div className="overflow-x-auto border border-slate-100 dark:border-slate-700 rounded-xl"><table className="w-full text-sm text-left"><thead className="bg-slate-50 dark:bg-slate-800 text-xs uppercase tracking-wide text-slate-500 dark:text-slate-400 font-bold"><tr><th className="p-3">Date</th><th className="p-3">FC</th><th className="p-3">TAS</th><th className="p-3">TAD</th><th className="p-3">SpO2</th><th className="p-3">Temp</th><th className="p-3">GCS</th><th className="p-3">EVA</th><th className="p-3">FR</th><th className="p-3">Risque</th></tr></thead><tbody className="divide-y divide-slate-100 dark:divide-slate-700">{vitalsHistory.slice().sort((a,b)=>new Date(b.heure_prise||b.date||0)-new Date(a.heure_prise||a.date||0)).map((e,i)=>{const r=e.risk_level||'LOW';const b=getRiskBadge(r);return(<tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/50"><td className="p-3 text-slate-500 dark:text-slate-400 text-xs">{e.heure_prise||e.date?new Date(e.heure_prise||e.date).toLocaleString('fr-FR'):'-'}</td><td className={'p-3 font-bold '+severityText[getSeverity('fc',e.fc)]}>{e.fc||'-'}</td><td className={'p-3 font-bold '+severityText[getSeverity('ta_systolique',e.ta_systolique)]}>{e.ta_systolique||'-'}</td><td className={'p-3 font-bold '+severityText[getSeverity('ta_diastolique',e.ta_diastolique)]}>{e.ta_diastolique||'-'}</td><td className={'p-3 font-bold '+severityText[getSeverity('spo2',e.spo2)]}>{e.spo2||'-'}</td><td className={'p-3 font-bold '+severityText[getSeverity('temperature',e.temperature)]}>{e.temperature?e.temperature.toFixed(1):'-'}</td><td className={'p-3 font-bold '+severityText[getSeverity('glasgow',e.glasgow)]}>{e.glasgow||'-'}</td><td className="p-3 font-bold text-slate-800 dark:text-slate-200">{e.douleur??'-'}</td><td className={'p-3 font-bold '+severityText[getSeverity('fr',e.frequence_respiratoire)]}>{e.frequence_respiratoire||'-'}</td><td className="p-3"><span className={'px-2 py-0.5 rounded text-xs font-bold border '+b}>{r}</span></td></tr>);})}</tbody></table></div>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
};
const App = () => {
    const [currentUser, setCurrentUser] = useState(null);
    const [activeModule, setActiveModule] = useState('acceuil');
    const [patients, setPatients] = useState([]);
    const [theme, setTheme] = useState(() => getPreferredTheme());
    const [wsConnected, setWsConnected] = useState(false);
    const [streamingActive, setStreamingActive] = useState(false);
    const [sidebarExpanded, setSidebarExpanded] = useState(true);
    const streamingToastShown = useRef(false);
    const lastStreamTime = useRef(null);
    const [lastEvent, setLastEvent] = useState(null);
    
    // WebSocket connection for real-time updates
    useEffect(() => {
        if (!currentUser || !window._authToken) return;
        let ws = null;
        const connectWS = () => {
            try {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                ws = new WebSocket(`${protocol}//127.0.0.1:8000/ws`);
                ws.onopen = () => { setWsConnected(true); console.log('WebSocket connected'); };
                ws.onclose = () => { setWsConnected(false); setTimeout(connectWS, 3000); };
                ws.onerror = () => { setWsConnected(false); };
                ws.onmessage = (evt) => {
                    try {
                        const data = JSON.parse(evt.data);
                        console.log('WebSocket event:', data);
                        setLastEvent(data);
                        // Auto-refresh on events
                        if (data.type === 'CONSTANTES_STREAM') {
                            window.dispatchEvent(new CustomEvent('constantes-update', { detail: data }));
                            setStreamingActive(true);
                            lastStreamTime.current = Date.now();
                            if (!streamingToastShown.current) {
                                streamingToastShown.current = true;
                                const toast = document.createElement('div');
                                toast.id = 'stream-toast';
                                toast.className = 'fixed top-4 right-4 z-[70] max-w-sm bg-blue-600 text-white px-5 py-4 rounded-2xl shadow-2xl animate-slide-up';
                                toast.innerHTML = '<div class="flex items-start gap-3"><div class="h-10 w-10 rounded-xl bg-white/20 flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-satellite-dish text-lg"></i></div><div class="min-w-0"><div class="text-[10px] font-black uppercase tracking-wide opacity-80 mb-0.5">Partage en direct activé</div><div class="text-sm font-medium leading-relaxed">Les données du moniteur multiparamétrique sont transmises en temps réel.</div></div></div>';
                                document.body.appendChild(toast);
                                setTimeout(() => { const el = document.getElementById('stream-toast'); if (el) el.remove(); }, 6000);
                            }
                        }
                        if (['ADMISSION', 'TRIAGE', 'RETRIAGE', 'ANNULATION', 'CONSTANTES_STREAM', 'LIT_AFFECTE', 'LIT_TRANSFERE', 'PRESCRIPTION', 'OBSERVATION', 'EXAMEN', 'SORTIE'].includes(data.type)) {
                            if (data.type !== 'CONSTANTES_STREAM') fetchPatients();
                            // Show toast notification
                            const eventNames = { 
                                ADMISSION: 'Nouvelle admission',
                                TRIAGE: 'Nouveau triage', 
                                RETRIAGE: 'Re-triage', 
                                LIT_AFFECTE: 'Lit affecté', 
                                LIT_TRANSFERE: 'Transfert', 
                                PRESCRIPTION: 'Nouvelle prescription',
                                OBSERVATION: 'Nouvelle observation',
                                EXAMEN: 'Nouvel examen',
                                SORTIE: 'Sortie',
                                CONSTANTES_STREAM: 'Nouvelles constantes',
                            };
                            const toast = document.createElement('div');
                            toast.className = 'fixed top-4 right-4 bg-medical-500 text-white px-4 py-3 rounded-xl shadow-lg z-50 animate-slide-up font-bold';
                            toast.innerHTML = `<i class="fa-solid fa-bolt mr-2"></i>${eventNames[data.type] || data.type}`;
                            document.body.appendChild(toast);
                            setTimeout(() => toast.remove(), 3000);
                        }
                    } catch {}
                };
            } catch { setTimeout(connectWS, 3000); }
        };
        connectWS();
        return () => { if (ws) ws.close(); };
    }, [currentUser]);
    useEffect(() => { setThemeOnDocument(theme); try { localStorage.setItem(themeStorageKey, theme); } catch {} }, [theme]);
    useEffect(() => {
        if (!streamingActive) return;
        const interval = setInterval(() => {
            if (lastStreamTime.current && Date.now() - lastStreamTime.current > 30000) {
                setStreamingActive(false);
            }
        }, 5000);
        return () => clearInterval(interval);
    }, [streamingActive]);
    const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');
    const handleLogout = async () => {
        try { if(window._authToken) await fetch(`${API_BASE}/logout/`, {method:'POST',headers:{'Authorization':`Bearer ${window._authToken}`}}); } catch{}
        window._authToken=null; setCurrentUser(null); setPatients([]);
    };
    useEffect(() => {
        if (currentUser) {
            if (currentUser.role === 'admin') setActiveModule('admin');
            else if (currentUser.role === 'medecin') setActiveModule('medecin');
            else if (currentUser.role === 'infirmier') setActiveModule('triage');
            else setActiveModule('acceuil');
        }
    }, [currentUser]);
    const fetchPatients = useCallback(async () => { try { const res = await apiFetch(`/sejours/attente`); if(res.ok) setPatients(await res.json()); } catch{} }, []);
    useEffect(() => {
        if(currentUser) {
            fetchPatients();
            // Keep a light polling as fallback (30 seconds instead of 10)
            const i = setInterval(fetchPatients, 30000);
            return () => clearInterval(i);
        }
    }, [currentUser, fetchPatients]);
    useEffect(() => { window._onUnauthorized = handleLogout; }, []);
    if (!currentUser) return <LoginScreen onLogin={setCurrentUser} theme={theme} toggleTheme={toggleTheme} />;
    const navItems = [
        { id: 'acceuil', label: 'Accueil', icon: 'fa-desktop', roles: ['admin', 'secretaire'] },
        { id: 'triage', label: 'Triage IOA', icon: 'fa-user-nurse', roles: ['admin', 'infirmier'] },
        { id: 'medecin', label: 'Soins & Médical', icon: 'fa-stethoscope', roles: ['admin', 'medecin'] },
        { id: 'monitoring', label: 'Monitoring', icon: 'fa-heart-pulse', roles: ['admin', 'medecin', 'infirmier'] },
        { id: 'admin', label: 'Régulation', icon: 'fa-chart-line', roles: ['admin'] }
    ].filter(i => i.roles.includes(currentUser.role));
    return (
        <div className="flex h-screen overflow-hidden font-sans">
            <nav className={(sidebarExpanded ? 'w-72' : 'w-20') + ' bg-slate-950 text-slate-300 flex flex-col shadow-2xl z-20 relative transition-all duration-300'}>
                <div className="absolute top-0 right-0 w-full h-full bg-gradient-to-b from-medical-900/20 to-transparent pointer-events-none"></div>
                <div className={'h-20 flex items-center border-b border-white/10 relative z-10 ' + (sidebarExpanded ? 'px-8' : 'justify-center')}>
                    <div className="flex items-center overflow-hidden">
                        <span className={'text-white font-black text-xl tracking-tight overflow-hidden whitespace-nowrap transition-all duration-300 ' + (sidebarExpanded ? 'max-w-40 opacity-100' : 'max-w-0 opacity-0')}>Urgences </span>
                        <span className={'font-black flex-shrink-0 tracking-tight ' + (sidebarExpanded ? 'text-xl' : 'text-xl') + ' text-emerald-400 drop-shadow-[0_0_6px_rgba(52,211,153,0.3)]'}>OS</span>
                    </div>
                    <button onClick={() => setSidebarExpanded(!sidebarExpanded)} className="absolute -right-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-slate-800 border border-slate-600 text-slate-400 hover:text-white hover:bg-slate-700 flex items-center justify-center transition z-20 shadow-lg">
                        <i className={'fa-solid fa-chevron-' + (sidebarExpanded ? 'left' : 'right') + ' text-[10px]'}></i>
                    </button>
                </div>
                <div className={(sidebarExpanded ? 'p-5' : 'p-3') + ' flex-1 space-y-2 relative z-10 overflow-y-auto'}>
                    {sidebarExpanded && <div className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 mt-2">Navigation Médicale</div>}
                    {navItems.map(item => (
                        <button key={item.id} onClick={() => setActiveModule(item.id)} className={'w-full flex items-center sidebar-menu-item relative ' + (sidebarExpanded ? 'px-4' : 'justify-center px-0') + ' py-3.5 rounded-xl font-semibold text-sm ' + (activeModule === item.id ? 'bg-medical-500/10 text-medical-400 border border-medical-500/20 shadow-inner' : 'hover:bg-white/5 hover:text-white border border-transparent')}>
                            {activeModule === item.id && (
                                <div className="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-6 bg-teal-500 rounded-r-full animate-fade-in"></div>
                            )}
                            <i className={'fa-solid ' + item.icon + ' w-6 text-center' + (sidebarExpanded ? ' mr-2' : '')}></i>{sidebarExpanded && item.label}
                        </button>
                    ))}
                </div>
                <div className={(sidebarExpanded ? 'p-6' : 'p-2') + ' bg-black/20 border-t border-white/5 relative z-10'}>
                    <div className={'flex items-center bg-white/5 rounded-2xl border border-white/10 ' + (sidebarExpanded ? 'justify-between p-3' : 'justify-center p-1')}>
                        <div className="flex items-center">
                            <div className={'rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center text-white font-black shadow-inner ' + (sidebarExpanded ? 'w-10 h-10 mr-3 text-sm' : 'w-9 h-9 text-xs')}>
                                {currentUser.prenom[0]}{currentUser.nom[0]}
                            </div>
                            {sidebarExpanded && <div>
                                <div className="text-white font-bold text-sm leading-tight truncate w-32">{currentUser.prenom} {currentUser.nom}</div>
                                <div className="text-medical-400 text-[10px] uppercase tracking-wide font-bold">{currentUser.role}</div>
                            </div>}
                        </div>
                        {sidebarExpanded && <button onClick={handleLogout} className="w-8 h-8 rounded-full hover:bg-red-500/20 text-slate-400 hover:text-red-400 flex items-center justify-center transition"><i className="fa-solid fa-power-off"></i></button>}
                    </div>
                </div>
            </nav>
            <main className="flex-1 flex flex-col h-screen overflow-hidden relative">
                <header className="h-20 glass-header flex items-center justify-between px-6 lg:px-10 flex-shrink-0 z-10">
                    <h2 className="text-2xl font-black text-slate-800 capitalize tracking-tight flex items-center">
                        <i className={`fa-solid ${navItems.find(i=>i.id===activeModule)?.icon || 'fa-asterisk'} text-slate-300 mr-4 text-xl`}></i>
                        {activeModule === 'medecin' ? 'Module Soins & Médical' : `Module ${activeModule.replace('-', ' ')}`}
                    </h2>
                    <div className="flex items-center gap-3">
                        <button onClick={toggleTheme} className="w-11 h-11 rounded-full bg-white border border-slate-200 shadow-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition flex items-center justify-center" aria-label="Basculer le thème">
                            <i className={`fa-solid ${theme === 'dark' ? 'fa-sun' : 'fa-moon'}`}></i>
                        </button>
                        <div className="bg-white border border-slate-200 px-4 py-2 rounded-full shadow-sm flex items-center text-sm font-bold text-slate-600">
                            <span className="relative flex h-2.5 w-2.5 mr-3"><span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span className="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span></span>
                            Flux Actif : {patients.length} patient{patients.length > 1 ? 's' : ''}
                        </div>
                        {streamingActive && activeModule === 'monitoring' && (
                            <div className="bg-emerald-50 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm flex items-center text-xs font-bold text-emerald-700">
                                <span className="relative flex h-2 w-2 mr-2">
                                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                    <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                </span>
                                Streaming actif
                            </div>
                        )}
                    </div>
                </header>
                <div className="flex-1 p-8 lg:p-10 overflow-hidden relative z-0">
                    <div className="absolute inset-0 bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] dark:bg-[radial-gradient(#38bdf8_1px,transparent_1px)] [background-size:20px_20px] opacity-35 dark:opacity-15 pointer-events-none"></div>
                    <MotionPresence mode='wait'>
                        <div className="relative h-full z-10">
                            {activeModule === 'acceuil' && <Acceuil patients={patients} fetchPatients={fetchPatients} />}
                            {activeModule === 'triage' && <TriageModule patients={patients} currentUser={currentUser} fetchPatients={fetchPatients} />}
                            {activeModule === 'medecin' && <MedecinDashboard patients={patients} currentUser={currentUser} fetchPatients={fetchPatients} />}
                            {activeModule === 'monitoring' && <MonitoringModule currentUser={currentUser} />}
                            {activeModule === 'admin' && <DashboardAdmin patients={patients} fetchPatients={fetchPatients} />}
                        </div>
                    </MotionPresence>
                </div>
            </main>
        </div>
    );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
